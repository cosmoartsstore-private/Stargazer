<!DOCTYPE html>
<!-- 内部設計資料。現行仕様や配布成果物ではありません。 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stargazer 背景テーマUIデモ</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #e8eef4;
    color: #152942;
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  }

  button,
  input,
  select {
    font: inherit;
  }

  .demo-page {
    padding: 28px;
  }

  .demo-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
  }

  .demo-title {
    margin: 0 0 6px;
    font-size: 22px;
    line-height: 1.2;
    letter-spacing: 0;
  }

  .demo-lead {
    margin: 0;
    color: #526982;
    font-size: 13px;
    line-height: 1.7;
  }

  .screen-switcher {
    display: inline-flex;
    gap: 4px;
    padding: 4px;
    background: rgba(255, 255, 255, 0.86);
    border: 1px solid rgba(116, 151, 185, 0.34);
    border-radius: 8px;
  }

  .screen-switcher button {
    min-width: 120px;
    padding: 8px 14px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: #526982;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  body[data-screen="applicants"] [data-screen-target="applicants"],
  body[data-screen="lottery"] [data-screen-target="lottery"],
  body[data-screen="attendance"] [data-screen-target="attendance"] {
    background: #ffffff;
    border-color: rgba(74, 142, 200, 0.25);
    color: #152942;
    box-shadow: 0 4px 12px rgba(30, 58, 95, 0.08);
  }

  .theme-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 18px;
  }

  .theme-card {
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 14px;
    background: #ffffff;
    box-shadow: 0 2px 14px rgba(30, 58, 95, 0.12);
  }

  .theme-meta {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid #edf4fb;
    background: #ffffff;
  }

  .theme-name {
    font-size: 14px;
    font-weight: 800;
  }

  .theme-note {
    color: #7890a8;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }

  .app-canvas {
    height: 720px;
    padding: 18px;
    --panel: rgba(255, 255, 255, 0.92);
    --panel-strong: rgba(255, 255, 255, 0.98);
    --panel-soft: rgba(255, 255, 255, 0.72);
    --line: rgba(70, 140, 210, 0.25);
    --line-soft: rgba(70, 140, 210, 0.15);
    --text: #1e3a5f;
    --text-strong: #152942;
    --muted: rgba(30, 58, 95, 0.62);
    --blue: #4a8ec8;
    --blue-dark: #2f79bd;
    --green: #2e9d6e;
    --red: #ed4245;
  }

  .theme-ice .app-canvas {
    background-color: #f8fcff;
    background-image:
      radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.95) 0 2px, transparent 2.5px),
      radial-gradient(circle at 78% 64%, rgba(186, 230, 253, 0.55) 0 2px, transparent 3px),
      radial-gradient(circle at 42% 82%, rgba(221, 214, 254, 0.36) 0 2px, transparent 3px),
      repeating-linear-gradient(60deg, rgba(96, 165, 250, 0.50) 0 1px, rgba(248, 252, 255, 0.88) 1px 19px, rgba(186, 230, 253, 0.34) 19px 59px, rgba(248, 252, 255, 0.88) 59px 82px),
      repeating-linear-gradient(-60deg, rgba(125, 211, 252, 0.52) 0 1px, rgba(248, 252, 255, 0.88) 1px 19px, rgba(191, 219, 254, 0.32) 19px 59px, rgba(248, 252, 255, 0.88) 59px 82px),
      linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(240, 249, 255, 0.88) 42%, rgba(238, 242, 255, 0.62));
    background-size: 120px 120px, 160px 160px, 140px 140px, auto, auto, auto;
  }

  .theme-aurora .app-canvas {
    background-color: #f8fcff;
    background-image:
      radial-gradient(ellipse at 16% 18%, rgba(186, 230, 253, 0.85) 0%, transparent 38%),
      radial-gradient(ellipse at 84% 20%, rgba(221, 214, 254, 0.48) 0%, transparent 42%),
      radial-gradient(ellipse at 55% 100%, rgba(240, 249, 255, 0.96) 0%, transparent 48%),
      repeating-linear-gradient(60deg, rgba(59, 130, 246, 0.34) 0 1px, rgba(255, 255, 255, 0.08) 1px 24px, rgba(147, 197, 253, 0.18) 24px 64px, rgba(255, 255, 255, 0.10) 64px 88px),
      repeating-linear-gradient(-60deg, rgba(14, 165, 233, 0.30) 0 1px, rgba(255, 255, 255, 0.08) 1px 24px, rgba(196, 181, 253, 0.16) 24px 64px, rgba(255, 255, 255, 0.10) 64px 88px),
      linear-gradient(135deg, #f8fcff, #eef9ff 48%, #f8f7ff);
  }

  .theme-soft .app-canvas {
    background-color: #f8fcff;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.95) 1px, transparent 1.8px),
      repeating-linear-gradient(90deg, rgba(125, 211, 252, 0.18) 0 18px, rgba(248, 252, 255, 0.72) 18px 36px),
      repeating-linear-gradient(0deg, rgba(147, 197, 253, 0.16) 0 18px, rgba(248, 252, 255, 0.72) 18px 36px),
      repeating-linear-gradient(45deg, transparent 0 22px, rgba(56, 189, 248, 0.16) 22px 23px, transparent 23px 44px),
      repeating-linear-gradient(-45deg, transparent 0 22px, rgba(186, 230, 253, 0.32) 22px 23px, transparent 23px 44px),
      linear-gradient(180deg, #f8fcff, #effaff);
    background-size: 16px 16px, auto, auto, auto, auto, auto;
  }

  .theme-vivid .app-canvas {
    --line: rgba(13, 148, 216, 0.36);
    --line-soft: rgba(14, 165, 233, 0.22);
    --blue: #0284c7;
    --blue-dark: #0369a1;
    background-color: #f1fbff;
    background-image:
      radial-gradient(circle at 12% 16%, rgba(255, 255, 255, 0.98) 0 2px, transparent 3px),
      radial-gradient(circle at 82% 66%, rgba(103, 232, 249, 0.45) 0 2px, transparent 3px),
      repeating-linear-gradient(60deg, rgba(14, 165, 233, 0.68) 0 1px, rgba(241, 251, 255, 0.84) 1px 18px, rgba(125, 211, 252, 0.48) 18px 58px, rgba(241, 251, 255, 0.86) 58px 82px),
      repeating-linear-gradient(-60deg, rgba(2, 132, 199, 0.58) 0 1px, rgba(241, 251, 255, 0.84) 1px 18px, rgba(186, 230, 253, 0.44) 18px 58px, rgba(241, 251, 255, 0.86) 58px 82px),
      linear-gradient(135deg, #f1fbff 0%, #e0f7ff 46%, #f7fdff 100%);
    background-size: 120px 120px, 160px 160px, auto, auto, auto;
  }

  .app-frame {
    display: grid;
    grid-template-columns: 128px minmax(0, 1fr);
    height: 100%;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.42);
    box-shadow: 0 10px 30px rgba(30, 58, 95, 0.12);
  }

  .sidebar {
    padding: 14px 10px;
    background: rgba(255, 255, 255, 0.9);
    border-right: 1px solid var(--line);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    color: var(--text-strong);
    font-size: 12px;
    font-weight: 900;
  }

  .logo-dot {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--blue), #7dd3fc);
    color: #ffffff;
    font-weight: 900;
  }

  .nav {
    display: grid;
    gap: 6px;
  }

  .nav-item {
    padding: 8px 9px;
    border-radius: 6px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
  }

  .nav-item.active {
    background: rgba(74, 142, 200, 0.14);
    color: var(--blue-dark);
  }

  .main {
    min-width: 0;
    padding: 16px;
    overflow: hidden;
  }

  .main-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 14px;
    border-bottom: 2px solid var(--line);
  }

  .main-tab {
    padding: 9px 14px;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .main-tab.active {
    color: var(--blue-dark);
    border-bottom-color: var(--blue);
  }

  .screen {
    display: none;
    min-width: 0;
  }

  body[data-screen="applicants"] .screen-applicants,
  body[data-screen="lottery"] .screen-lottery,
  body[data-screen="attendance"] .screen-attendance {
    display: block;
  }

  .page-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .page-title {
    margin: 0;
    color: var(--text-strong);
    font-size: 18px;
    line-height: 1.2;
  }

  .page-subtitle {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    min-height: 28px;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    color: var(--blue-dark);
    font-size: 11px;
    font-weight: 900;
  }

  .toolbar {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    margin-bottom: 12px;
  }

  .input {
    min-width: 0;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel-strong);
    color: var(--text);
    font-size: 12px;
  }

  .btn {
    min-height: 34px;
    padding: 8px 13px;
    border: 0;
    border-radius: 6px;
    background: var(--blue);
    color: #ffffff;
    font-size: 12px;
    font-weight: 900;
  }

  .btn.secondary {
    border: 1px solid var(--line);
    background: rgba(74, 142, 200, 0.10);
    color: var(--blue-dark);
  }

  .table-wrap {
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 11px;
  }

  th {
    padding: 9px 10px;
    background: var(--panel-strong);
    color: var(--muted);
    text-align: left;
    font-weight: 900;
  }

  td {
    padding: 10px;
    border-top: 1px solid var(--line-soft);
    color: var(--text);
    vertical-align: top;
  }

  .name-cell {
    color: var(--text-strong);
    font-weight: 900;
    overflow-wrap: anywhere;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(74, 142, 200, 0.13);
    color: var(--blue-dark);
    font-size: 10px;
    font-weight: 900;
  }

  .tag.red {
    background: rgba(237, 66, 69, 0.12);
    color: #c73335;
  }

  .two-pane {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 150px;
    gap: 12px;
  }

  .section {
    padding: 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
  }

  .section-title {
    margin: 0 0 10px;
    color: var(--text-strong);
    font-size: 14px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .field {
    display: grid;
    gap: 5px;
  }

  .label {
    color: var(--muted);
    font-size: 10px;
    font-weight: 900;
  }

  .select-like,
  .number-like {
    min-height: 34px;
    padding: 8px 9px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel-strong);
    color: var(--text-strong);
    font-size: 12px;
    font-weight: 800;
  }

  .validation {
    display: grid;
    gap: 8px;
  }

  .validation-row {
    padding: 9px;
    border: 1px solid var(--line-soft);
    border-radius: 6px;
    background: var(--panel-soft);
    font-size: 11px;
  }

  .validation-row strong {
    display: block;
    color: var(--text-strong);
    margin-bottom: 2px;
  }

  .validation-row span {
    color: var(--muted);
  }

  .attendance-tabs {
    display: inline-flex;
    gap: 4px;
    padding: 4px;
    margin-bottom: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.64);
  }

  .attendance-tab {
    min-width: 96px;
    padding: 7px 12px;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 900;
  }

  .attendance-tab.active {
    background: var(--panel-strong);
    border-color: var(--line);
    color: var(--text-strong);
  }

  .attendance-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .attendance-col {
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
  }

  .attendance-col-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 11px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-strong);
    color: var(--text-strong);
    font-size: 12px;
    font-weight: 900;
  }

  .attendance-list {
    display: grid;
    gap: 6px;
    padding: 9px;
  }

  .cast-chip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 32px;
    padding: 7px 9px;
    border: 1px solid transparent;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 900;
  }

  .cast-chip.present {
    background: var(--green);
    border-color: rgba(46, 157, 110, 0.5);
    color: #ffffff;
  }

  .cast-chip.wait-normal {
    background: var(--panel-strong);
    border-color: var(--line);
    color: var(--text-strong);
  }

  .cast-chip.wait-normal::after {
    content: "未選択";
    color: var(--muted);
    font-size: 10px;
  }

  .cast-chip.wait-selected {
    border-color: var(--line);
    border-style: dashed;
    background: rgba(255, 255, 255, 0.36);
    color: var(--muted);
    opacity: 0.62;
  }

  .cast-chip.wait-selected::after {
    content: "待機";
    font-size: 10px;
  }

  .screen-sample {
    min-height: 590px;
  }

  @media (max-width: 720px) {
    .demo-page {
      padding: 18px;
    }

    .demo-header {
      align-items: stretch;
      flex-direction: column;
    }

    .screen-switcher {
      display: grid;
      grid-template-columns: 1fr;
    }

    .theme-grid {
      grid-template-columns: 1fr;
    }

    .app-frame {
      grid-template-columns: 1fr;
    }

    .sidebar {
      display: none;
    }

    .two-pane,
    .attendance-columns,
    .form-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body data-screen="applicants">
<div class="demo-page">
  <header class="demo-header">
    <div>
      <h1 class="demo-title">Stargazer 背景テーマUIデモ</h1>
      <p class="demo-lead">現行UIに近い3画面で、指定背景 1 / 3 / 4 と、水色寄りにした現行チェックのビビッド版を比較します。</p>
    </div>
    <div class="screen-switcher" aria-label="画面切替">
      <button type="button" data-screen-target="applicants">応募データ一覧</button>
      <button type="button" data-screen-target="lottery">抽選設定</button>
      <button type="button" data-screen-target="attendance">出席設定</button>
    </div>
  </header>

  <div class="theme-grid">
    <article class="theme-card theme-ice">
      <div class="theme-meta">
        <div class="theme-name">1. アイスリボンチェック</div>
        <div class="theme-note">斜めチェック＋淡紫</div>
      </div>
      <div class="app-canvas">
        <div class="app-frame">
          <aside class="sidebar"><div class="logo"><span class="logo-dot">S</span>STARGAZER</div><div class="nav"><div class="nav-item active">応募データ</div><div class="nav-item">内部管理</div><div class="nav-item">ヘルプ</div></div></aside>
          <main class="main"><div class="screen screen-applicants"></div><div class="screen screen-lottery"></div><div class="screen screen-attendance"></div></main>
        </div>
      </div>
    </article>

    <article class="theme-card theme-aurora">
      <div class="theme-meta">
        <div class="theme-name">3. オーロラチェック</div>
        <div class="theme-note">楕円グラデ＋細線</div>
      </div>
      <div class="app-canvas">
        <div class="app-frame">
          <aside class="sidebar"><div class="logo"><span class="logo-dot">S</span>STARGAZER</div><div class="nav"><div class="nav-item active">応募データ</div><div class="nav-item">内部管理</div><div class="nav-item">ヘルプ</div></div></aside>
          <main class="main"><div class="screen screen-applicants"></div><div class="screen screen-lottery"></div><div class="screen screen-attendance"></div></main>
        </div>
      </div>
    </article>

    <article class="theme-card theme-soft">
      <div class="theme-meta">
        <div class="theme-name">4. ふわふわ水色チェック</div>
        <div class="theme-note">正方形チェック感</div>
      </div>
      <div class="app-canvas">
        <div class="app-frame">
          <aside class="sidebar"><div class="logo"><span class="logo-dot">S</span>STARGAZER</div><div class="nav"><div class="nav-item active">応募データ</div><div class="nav-item">内部管理</div><div class="nav-item">ヘルプ</div></div></aside>
          <main class="main"><div class="screen screen-applicants"></div><div class="screen screen-lottery"></div><div class="screen screen-attendance"></div></main>
        </div>
      </div>
    </article>

    <article class="theme-card theme-vivid">
      <div class="theme-meta">
        <div class="theme-name">現行チェック 水色ビビッド案</div>
        <div class="theme-note">青みと彩度を強化</div>
      </div>
      <div class="app-canvas">
        <div class="app-frame">
          <aside class="sidebar"><div class="logo"><span class="logo-dot">S</span>STARGAZER</div><div class="nav"><div class="nav-item active">応募データ</div><div class="nav-item">内部管理</div><div class="nav-item">ヘルプ</div></div></aside>
          <main class="main"><div class="screen screen-applicants"></div><div class="screen screen-lottery"></div><div class="screen screen-attendance"></div></main>
        </div>
      </div>
    </article>
  </div>
</div>

<template id="screen-applicants-template">
  <div class="screen-sample">
    <div class="main-tabs"><div class="main-tab active">一覧</div><div class="main-tab">抽選</div><div class="main-tab">マッチング</div></div>
    <div class="page-title-row">
      <div><h2 class="page-title">応募データ一覧</h2><p class="page-subtitle">ファイル名を直表示し、NGキャストは応募者詳細で確認します。</p></div>
      <span class="status-pill">128件</span>
    </div>
    <div class="toolbar"><input class="input" value="2026_summer_event.tsv"><button class="btn secondary">再取り込み</button></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th style="width: 30%;">ユーザー名</th><th style="width: 22%;">X ID</th><th>希望1</th><th>希望2</th><th style="width: 22%;">NGキャスト</th></tr></thead>
        <tbody>
          <tr><td class="name-cell">星野ひかり</td><td>@starlight_vrc</td><td>キャストA</td><td>キャストC</td><td><span class="tag red">2名のキャストがNG</span></td></tr>
          <tr><td class="name-cell">とても長い応募者名のサンプルユーザー</td><td>@long_name_sample</td><td>キャストB</td><td>キャストD</td><td>キャストE</td></tr>
          <tr><td class="name-cell">水瀬あおい</td><td>@aoi_vrc</td><td>キャストC</td><td>キャストA</td><td>なし</td></tr>
          <tr><td class="name-cell">夏目るな</td><td>@luna_event</td><td>キャストD</td><td>キャストB</td><td><span class="tag red">3名のキャストがNG</span></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</template>

<template id="screen-lottery-template">
  <div class="screen-sample">
    <div class="main-tabs"><div class="main-tab">一覧</div><div class="main-tab active">抽選</div><div class="main-tab">マッチング</div></div>
    <div class="page-title-row">
      <div><h2 class="page-title">抽選設定</h2><p class="page-subtitle">応募データと同じ密度で、設定と検証を並べて確認します。</p></div>
      <span class="status-pill">合計席数 48</span>
    </div>
    <div class="two-pane">
      <section class="section">
        <h3 class="section-title">条件</h3>
        <div class="form-grid">
          <label class="field"><span class="label">マッチング形式</span><div class="select-like">M003 テーブル制</div></label>
          <label class="field"><span class="label">当選人数</span><div class="number-like">44</div></label>

<template id="screen-attendance-template">
  <div class="screen-sample">
    <div class="main-tabs"><div class="main-tab">キャスト名簿</div><div class="main-tab">NG管理</div><div class="main-tab">投稿テンプレ</div><div class="main-tab active">出席管理</div></div>
    <div class="page-title-row">
      <div><h2 class="page-title">出席設定</h2><p class="page-subtitle">待機欄は全員を残し、待機選択済みだけ非活性風にします。</p></div>
      <span class="status-pill">3名 出席中</span>
    </div>
    <div class="attendance-tabs"><div class="attendance-tab active">出席設定</div><div class="attendance-tab">出席履歴</div></div>
    <div class="attendance-columns">
      <section class="attendance-col">
        <div class="attendance-col-head"><span>出席中</span><span>3</span></div>
        <div class="attendance-list">
          <div class="cast-chip present">キャストA</div>
          <div class="cast-chip present">キャストB</div>
          <div class="cast-chip present">長い名前のキャストCサンプル</div>
        </div>
      </section>
      <section class="attendance-col">
        <div class="attendance-col-head"><span>待機</span><span>2</span></div>
        <div class="attendance-list">
          <div class="cast-chip wait-normal">キャストA</div>
          <div class="cast-chip wait-normal">キャストB</div>
          <div class="cast-chip wait-normal">長い名前のキャストCサンプル</div>
          <div class="cast-chip wait-selected">キャストD</div>
          <div class="cast-chip wait-selected">キャストE</div>
        </div>

  </div>
</template>

<script>
  const screens = ["applicants", "lottery", "attendance"];
  for (const screen of screens) {
    const template = document.getElementById(`screen-${screen}-template`);
    document.querySelectorAll(`.screen-${screen}`).forEach((target) => {
      target.appendChild(template.content.cloneNode(true));
    });
  }

  document.querySelectorAll("[data-screen-target]").forEach((button) => {
    button.addEventListener("click", () => {
      document.body.dataset.screen = button.dataset.screenTarget;
    });
  });
</script>
