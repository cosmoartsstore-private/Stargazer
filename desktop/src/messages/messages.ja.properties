GuidePage.flow.attendance.step1=「出席管理」を開き、「出席設定」タブを選ぶ
GuidePage.flow.attendance.step2=当日参加できないキャストを選び、「未出席」へ移動する。変更はすぐに保存される
GuidePage.flow.attendance.step3=必要に応じて「全員を出席にする」で一括設定する
GuidePage.flow.attendance.step4=履歴を残す場合は「出席を記録」から記録日と出席キャストを確認して保存する

# GuidePage flow steps 4-6
GuidePage.flow.lottery.step1=応募データ画面で「抽選へ進む」を選び、抽選画面でマッチング方式を選ぶ
GuidePage.flow.lottery.step2=抽選で選ぶ人数・ラウンド数・テーブル数などを設定する
GuidePage.flow.lottery.step3=実行前の確認でエラーがないことを確認する
GuidePage.flow.lottery.step4=「抽選を実行」で当選者を決定する
GuidePage.flow.lottery.step5=残したい結果は「抽選結果を保存」でアプリ内に保存する
GuidePage.flow.matching.step1=抽選画面で「マッチングへ進む」を選び、マッチング画面で割り当て条件を確認する
GuidePage.flow.matching.step2=X IDに基づくNG条件に該当する割り当ては除外される
GuidePage.flow.matching.step3=「マッチングを実行」でキャストを割り当てる
GuidePage.flow.matching.step4=結果をキャスト別・テーブル別の表で確認する
GuidePage.flow.output.step1=抽選結果は「抽選結果を保存」でアプリ内に保存し、応募管理の開始画面から再び開ける
GuidePage.flow.output.step2=キャスト別結果またはテーブル別結果をPNGファイルとして保存する
GuidePage.flow.output.step3=「マッチング結果を保存」で割り当てをアプリ内の履歴へ保存する
GuidePage.flow.output.step4=X投稿には「投稿テンプレート」タブでテンプレートを編集してコピーする

# GuidePage FAQ
GuidePage.faq.title=よくある質問
GuidePage.faq.questionMarker=Q
GuidePage.faq.answerMarker=A
GuidePage.faq.item1.question=応募管理で抽選・マッチングへ進めない
GuidePage.faq.item1.answer=イベントを開いて応募データを取り込むと抽選へ進めます。マッチングへ進むには、現在の条件で抽選を完了してください。
GuidePage.faq.item2.question=応募データを確認したい
GuidePage.faq.item2.answer=作業中は応募管理の応募データ画面で取り込み済みの応募者を確認します。新しく取り込む場合は、応募管理へ戻って「応募データを新規で取り込む」を選びます。
GuidePage.faq.item3.question=抽選をやり直したい
GuidePage.faq.item3.answer=抽選画面で再度「抽選を実行」を選びます。上書きの確認画面が表示されます。マッチングも再実行が必要です。
GuidePage.faq.item4.question=前に保存した抽選結果を使いたい
GuidePage.faq.item4.answer=応募管理の開始画面で「保存した抽選結果から開始」を選び、使用する結果を開きます。当選者に加え、保存時のマッチング方式と抽選で選ぶ人数も復元されます。
GuidePage.faq.item5.question=NGを追加したい
GuidePage.faq.item5.answer=NG管理でキャストのNGユーザーを追加します。理由・メモも一緒に記録できます。追加後はマッチング画面で「結果のロックを解除」を選び、再実行してください。
GuidePage.faq.item6.question=キャストの出席状態を変えたい
GuidePage.faq.item6.answer=出席管理でキャストを選ぶと出席状態が変わり、すぐに保存されます。履歴を残す場合は「出席を記録」から保存します。マッチング結果がある場合は「結果のロックを解除」して、マッチングを再実行してください。
GuidePage.faq.item7.question=前回と同じキャストデータを使いたい
GuidePage.faq.item7.answer=キャスト名簿は同一イベント内のセッション間で共有されます。別イベントでは、そのイベントのキャスト名簿を使います。
GuidePage.faq.item8.question=応募データを複数イベント分管理したい
GuidePage.faq.item8.answer=「イベント管理」からイベントを切り替えます。切り替えると作業中の応募データと未保存の結果は破棄され、作業セッション自体は再開できません。キャスト情報、NG登録、出席履歴、明示保存した抽選・マッチング結果はイベントごとに分けて管理されます。
GuidePage.faq.item9.question=結果をファイルとして保存したい
GuidePage.faq.item9.answer=抽選結果とマッチング結果はアプリ内へ明示保存でき、イベントを削除するまで保持されます。マッチング結果はキャスト別TSV、またはキャスト別・テーブル別PNGとしても保存できます。
GuidePage.faq.item10.question=アンインストールや再インストールの前にデータを残したい
GuidePage.faq.item10.answer=通常のアンインストールではインストール先のDataフォルダーを残します。別の場所へ再インストールすると以前のDataは自動検出されないため、Stargazerを終了してからDataフォルダー全体をバックアップし、必要に応じて新しいインストール先へコピーしてください。

