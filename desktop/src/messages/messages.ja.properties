# GuidePage FAQ
GuidePage.faq.title=よくある質問
GuidePage.faq.questionMarker=Q
GuidePage.faq.answerMarker=A
GuidePage.faq.item1.question=応募管理の抽選・マッチングタブを選べない
GuidePage.faq.item1.answer=イベントを開いてから応募データを取り込むと抽選タブが有効になります。マッチングタブは抽選結果がある場合に有効になります。
GuidePage.faq.item2.question=応募データを確認したい
GuidePage.faq.item2.answer=「応募管理」→「データ取り込み」で取り込み済みの応募者を確認します。再取り込み、詳細確認、個別削除も同じ画面でできます。
GuidePage.faq.item3.question=抽選をやり直したい
GuidePage.faq.item3.answer=抽選タブで再度「抽選を実行」を選びます。上書きの確認画面が表示されます。マッチングも再実行が必要です。
GuidePage.faq.item4.question=前に保存した抽選結果を使いたい
GuidePage.faq.item4.answer=抽選タブの「保存済み抽選結果」から結果を選び、「保存済み結果を開く」を選択します。当選者に加え、保存時のマッチング方式と抽選で選ぶ人数も復元されます。
GuidePage.faq.item5.question=NGを追加したい
GuidePage.faq.item5.answer=NG管理タブでキャストのNGユーザーを追加します。理由・メモも一緒に記録できます。追加後はマッチングタブで「結果のロックを解除」を選び、再実行してください。
GuidePage.faq.item6.question=キャストの出席状態を変えたい
GuidePage.faq.item6.answer=出席管理でキャストを選ぶと出席状態が変わり、すぐに保存されます。履歴を残す場合は「出席を記録」から保存します。マッチング結果がある場合は「結果のロックを解除」して、マッチングを再実行してください。
GuidePage.faq.item7.question=前回と同じキャストデータを使いたい
GuidePage.faq.item7.answer=キャスト名簿は同一イベント内のセッション間で共有されます。別イベントでは、そのイベントのキャスト名簿を使います。
GuidePage.faq.item8.question=応募データを複数イベント分管理したい
GuidePage.faq.item8.answer=「イベント管理」からイベントを切り替えます。応募データと抽選結果はイベントごとに分けて管理されます。マッチング結果はイベントを切り替える前にPNGまたはTSVで保存してください。
GuidePage.faq.item9.question=結果をファイルとして保存したい
GuidePage.faq.item9.answer=抽選結果はアプリ内に保存されます。マッチング結果はPNGまたはTSVファイルとして保存できます。

