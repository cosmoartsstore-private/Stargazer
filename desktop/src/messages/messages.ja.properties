# GuidePage flow steps 1-3
GuidePage.flow.import.step1=Googleフォームの回答をスプレッドシートに連携し、TSV形式でダウンロードする
GuidePage.flow.import.step2=応募管理の開始画面で「応募データを新規で取り込む」を選び、「TSVファイルを選択」からファイルを選ぶ
GuidePage.flow.import.step3=自動設定された列の対応付けと、X IDが空、形式不正、または重複している行を確認する
GuidePage.flow.import.step4=一覧で確認する場合は「取り込む」、すぐ抽選へ進む場合は「抽選へ進む」を選ぶ
GuidePage.flow.applicantData.step1=取り込み後の応募データ画面で応募者一覧を確認する
GuidePage.flow.applicantData.step2=応募者を選び、VRChat URL、追加列、NGキャストなどの詳細を確認する
GuidePage.flow.applicantData.step3=NGキャストに一致する応募者は一覧と詳細で確認できる
GuidePage.flow.applicantData.step4=問題があれば「再取り込み」または個別削除で対応する
