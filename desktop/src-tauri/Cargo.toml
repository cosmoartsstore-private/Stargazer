[package]
name = "desktop"
version = "0.1.0"
description = "Stargazer Desktop App"
authors = ["CosmoArtsStore"]
edition = "2021"

# manifest の定義: https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Windows で bin と lib の名前が競合しないよう、lib 名に `_lib` を付ける。
#
# 背景: https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
winreg = "0.52"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
