name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows verification
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust components
        shell: pwsh
        run: |
          rustup default stable
          rustup component add rustfmt clippy

      - name: Install Frontend dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --prefix desktop

      - name: Audit npm dependencies
        run: npm audit --audit-level=low --prefix desktop

      - name: Test Frontend with coverage
        run: npm run test:coverage

      - name: Build Frontend
        run: npm run build --prefix desktop

      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
